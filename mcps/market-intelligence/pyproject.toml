[project]
name = "market-intelligence"
version = "0.1.0"
description = "MCP server for financial intelligence across US, India, and Canada markets"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "yfinance>=0.2.40",
    "ta>=0.11.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "nsepython>=2.9",
    "nsetools>=2.0",
]

[project.scripts]
market-intelligence = "market_intelligence.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_intelligence"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
