name: CI

on:
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: {{NODE_VERSION}}
          cache: {{PKG_MANAGER}}
      - run: {{PKG_MANAGER}} ci {{INSTALL_FLAGS}}
      - run: {{TYPECHECK_CMD}}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: {{NODE_VERSION}}
          cache: {{PKG_MANAGER}}
      - run: {{PKG_MANAGER}} ci {{INSTALL_FLAGS}}
      - run: {{LINT_CMD}}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: {{NODE_VERSION}}
          cache: {{PKG_MANAGER}}
      - run: {{PKG_MANAGER}} ci {{INSTALL_FLAGS}}
      - run: {{TEST_CMD}}
